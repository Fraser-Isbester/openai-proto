syntax = "proto3";

package openai.finetuning.v1;

option go_package = "github.com/Fraser-Isbester/openai-proto/gen/go/openai/finetuning/v1;finetuningv1";

import "google/protobuf/struct.proto";
import "openai/common/v1/common.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_VALIDATING_FILES = 1;
  JOB_STATUS_QUEUED = 2;
  JOB_STATUS_RUNNING = 3;
  JOB_STATUS_SUCCEEDED = 4;
  JOB_STATUS_FAILED = 5;
  JOB_STATUS_CANCELLED = 6;
}

enum MethodType {
  METHOD_TYPE_UNSPECIFIED = 0;
  METHOD_TYPE_SUPERVISED = 1;
  METHOD_TYPE_DPO = 2;
  METHOD_TYPE_REINFORCEMENT = 3;
}

enum EventLevel {
  EVENT_LEVEL_UNSPECIFIED = 0;
  EVENT_LEVEL_INFO = 1;
  EVENT_LEVEL_WARN = 2;
  EVENT_LEVEL_ERROR = 3;
}

message Job {
  string id = 1;
  string object = 2;
  int64 created_at = 3;
  optional openai.common.v1.Error error = 4;
  optional string fine_tuned_model = 5;
  optional int64 finished_at = 6;
  // Legacy top-level hyperparameters; only returned for supervised jobs.
  optional SupervisedHyperparameters hyperparameters = 7;
  string model = 8;
  string organization_id = 9;
  repeated string result_files = 10;
  JobStatus status = 11;
  optional int64 trained_tokens = 12;
  string training_file = 13;
  optional string validation_file = 14;
  repeated Integration integrations = 15;
  optional int64 seed = 16;
  optional int64 estimated_finish = 17;
  optional Method method = 18;
  map<string, string> metadata = 19;
}

message Method {
  MethodType type = 1;
  optional SupervisedMethod supervised = 2;
  optional DpoMethod dpo = 3;
  optional ReinforcementMethod reinforcement = 4;
}

message SupervisedMethod {
  optional SupervisedHyperparameters hyperparameters = 1;
}

message DpoMethod {
  optional DpoHyperparameters hyperparameters = 1;
}

message ReinforcementMethod {
  // Grader union (string_check, text_similarity, python, score_model, multi);
  // represented as a Struct rather than a fixed schema.
  google.protobuf.Struct grader = 1;
  optional ReinforcementHyperparameters hyperparameters = 2;
}

// batch_size, learning_rate_multiplier and n_epochs each accept the string
// "auto" or a number, so they are modeled as google.protobuf.Value.
message SupervisedHyperparameters {
  google.protobuf.Value batch_size = 1;
  google.protobuf.Value learning_rate_multiplier = 2;
  google.protobuf.Value n_epochs = 3;
}

message DpoHyperparameters {
  google.protobuf.Value beta = 1;
  google.protobuf.Value batch_size = 2;
  google.protobuf.Value learning_rate_multiplier = 3;
  google.protobuf.Value n_epochs = 4;
}

message ReinforcementHyperparameters {
  google.protobuf.Value batch_size = 1;
  google.protobuf.Value learning_rate_multiplier = 2;
  google.protobuf.Value n_epochs = 3;
  optional string reasoning_effort = 4;
  google.protobuf.Value compute_multiplier = 5;
  google.protobuf.Value eval_interval = 6;
  google.protobuf.Value eval_samples = 7;
}

message Integration {
  string type = 1;
  WandbIntegration wandb = 2;
}

message WandbIntegration {
  string project = 1;
  optional string name = 2;
  optional string entity = 3;
  repeated string tags = 4;
}

message JobEvent {
  string id = 1;
  string object = 2;
  int64 created_at = 3;
  EventLevel level = 4;
  string message = 5;
  optional google.protobuf.Struct data = 6;
  optional string type = 7;
}

message Checkpoint {
  string id = 1;
  string object = 2;
  int64 created_at = 3;
  string fine_tuned_model_checkpoint = 4;
  string fine_tuning_job_id = 5;
  int32 step_number = 6;
  Metrics metrics = 7;
}

message Metrics {
  double step = 1;
  double train_loss = 2;
  double train_mean_token_accuracy = 3;
  double valid_loss = 4;
  double valid_mean_token_accuracy = 5;
  double full_valid_loss = 6;
  double full_valid_mean_token_accuracy = 7;
}
