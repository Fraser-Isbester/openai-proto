syntax = "proto3";

package openai.chat.v1;

option go_package = "github.com/openai/openai-proto/gen/go/openai/chat/v1;chatv1";

import "openai/chat/v1/chat_messages.proto";

service ChatService {
  // Standard unary RPC for standard text generation
  rpc CreateChatCompletion (ChatCompletionRequest) returns (ChatCompletionResponse);

  // Server-streaming RPC replicating the HTTP SSE streaming interface
  rpc StreamChatCompletion (ChatCompletionRequest) returns (stream ChatCompletionStreamResponse);
}
