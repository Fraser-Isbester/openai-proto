syntax = "proto3";

package openai.batch.v1;

option go_package = "github.com/openai/openai-proto/gen/go/openai/batch/v1;batchv1";

import "openai/batch/v1/batch_messages.proto";

service BatchService {
  // POST /v1/batches
  rpc CreateBatch (CreateBatchRequest) returns (CreateBatchResponse);

  // GET /v1/batches/{batch_id}
  rpc RetrieveBatch (RetrieveBatchRequest) returns (RetrieveBatchResponse);

  // POST /v1/batches/{batch_id}/cancel
  rpc CancelBatch (CancelBatchRequest) returns (CancelBatchResponse);

  // GET /v1/batches
  rpc ListBatches (ListBatchesRequest) returns (ListBatchesResponse);
}

message CreateBatchRequest {
  string input_file_id = 1;
  string endpoint = 2;
  string completion_window = 3;
  map<string, string> metadata = 4;
}

message CreateBatchResponse {
  Batch batch = 1;
}

message RetrieveBatchRequest {
  string batch_id = 1;
}

message RetrieveBatchResponse {
  Batch batch = 1;
}

message CancelBatchRequest {
  string batch_id = 1;
}

message CancelBatchResponse {
  Batch batch = 1;
}

message ListBatchesRequest {
  optional string after = 1;
  optional int32 limit = 2;
}

message ListBatchesResponse {
  repeated Batch data = 1;
  bool has_more = 2;
  optional string object = 3;
  optional string first_id = 4;
  optional string last_id = 5;
}
