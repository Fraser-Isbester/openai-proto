version: v1
plugins:
  - plugin: buf.build/protocolbuffers/go:v1.33.0
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/community/timostamm-protobuf-ts:v2.9.3
    out: packages/typescript/src
  - plugin: buf.build/protocolbuffers/python:v26.1
    out: packages/python/src
  - plugin: buf.build/protocolbuffers/pyi:v26.1
    out: packages/python/src
  - plugin: buf.build/grpc/python:v1.65.5
    out: packages/python/src
